# Unit assertions compare isolated synthetic fixtures with explicit expected output.
# Catalog provenance fields below are test fixtures, not actual insurer references.
version: 2
unit_tests:
  - name: quote_classification_and_expiry_boundary
    description: Original values survive while each unusable quote gets the right exclusion reason.
    model: fct_quote
    # Keep fixture expiry decisions fixed even when a pipeline run supplies a later time.
    overrides:
      vars:
        as_of_timestamp: '2026-09-20 12:00:00'
    given:
      - input: source('insurance', 'plans')
        rows:
          - plan_id: P1
            insurer_name: Assertion Test Insurer
            plan_name: Assertion Fixture
            policy_type: INDIVIDUAL
            sum_insured_inr: 1000000
            min_entry_age: 18
            max_entry_age: 65
            max_adults: 1
            max_children: 0
            copay_pct: 20
            ped_wait_months: 36
            room_category: SINGLE_PRIVATE_ROOM
            max_entry_age_unlimited: false
            max_members: 1
            product_uin: UNIT-TEST
            source_url: https://example.invalid/unit-fixture
            source_note: Isolated synthetic assertion fixture; not a published product.
            source_checked_on: '2026-09-20'
            catalog_origin: PUBLISHED_REFERENCE
      - input: source('insurance', 'requests')
        rows:
          - request_id: R1
            requested_at: '2026-09-19 10:00:00'
            city: Mumbai
            state: Maharashtra
            oldest_age: 35
            adults: 1
            children: 0
            policy_type: INDIVIDUAL
            sum_insured_inr: 1000000
            annual_budget_inr: 10000
            data_origin: GENERATED_SCENARIO
